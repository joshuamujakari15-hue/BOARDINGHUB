<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/...') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }

    .overlay {
      background: rgba(0,0,0,0.55);
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .signup-card {
      background: #fff;
      color: #333;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeUp 1s ease-in-out;
    }

    .signup-card h2 {
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #2575fc;
    }

    .signup-card input,
    .signup-card select {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .signup-card input:focus,
    .signup-card select:focus {
      border-color: #2575fc;
      outline: none;
      box-shadow: 0 0 6px rgba(37,117,252,0.4);
    }

    .signup-card button {
      width: 100%;
      padding: 0.9rem;
      background: #2575fc;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .signup-card button:hover {
      background: #1a5ed9;
      transform: scale(1.03);
    }

    .signup-card .login-link {
      display: block;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #2575fc;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .signup-card .login-link:hover {
      color: #1a5ed9;
    }

    footer {
      background: rgba(0,0,0,0.7);
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #fff;
      backdrop-filter: blur(4px);
    }

    footer p {
      margin: 0.3rem 0;
    }

    footer a {
      color: #ffd700;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #ffae00;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Confirmation Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      color: #333;
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      animation: fadeUp 0.5s ease-in-out;
    }

    .modal-content h3 {
      margin-bottom: 1rem;
      color: #2575fc;
    }

    .modal-content button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background: #2575fc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .modal-content button:hover {
      background: #1a5ed9;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="signup-card">
      <h2>Signup</h2>
      <form id="signupForm">
        <input id="name" placeholder="Name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <select id="role">
          <option value="tenant">Tenant</option>
          <option value="owner">Owner</option>
        </select>
        <button type="submit">Sign Up</button>
      </form>
      <a href="login.html" class="login-link">Already have an account? Login here</a>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div class="modal" id="confirmationModal">
    <div class="modal-content">
      <h3>Signup Successful 🎉</h3>
      <p>Your account has been created successfully.</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <footer>
    <p>Created by <strong>JoshWebs</strong> © 2025</p>
    <p>Contact us: <a href="mailto:joshuamujakari15@gmail.com">joshuamujakari15@gmail.com</a></p>
  </footer>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const modal = document.getElementById('confirmationModal');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      // Normally you'd handle signup logic here (saving user, API call, etc.)
      // Show confirmation modal
      modal.style.display = 'flex';
    });

    function closeModal() {
      modal.style.display = 'none';
      // Optionally redirect to dashboard or login
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
